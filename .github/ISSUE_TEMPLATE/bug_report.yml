name: Bug report
description: Report a reproducible problem (never include credentials)
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please redact bot tokens, access keys, private links, personal data and database records."
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "WordPress 6.x, PHP 8.x, WooCommerce x.x (optional)"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
