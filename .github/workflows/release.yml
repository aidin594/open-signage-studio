name: Release ZIP
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    name: Validate and package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate
        run: bash scripts/validate.sh
      - name: Package installable plugin
        run: bash scripts/package.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "OpenSignage Studio ${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease
